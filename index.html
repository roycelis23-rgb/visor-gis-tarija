<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoTarija - Visor GIS y Monitoreo de Incendios</title>
    
    <!-- Hojas de estilo de Leaflet y Leaflet Draw -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">
            <i class="fa-solid fa-fire-flame-curved"></i>
            <span>GeoTarija - Monitoreo Territorial</span>
        </div>
        <nav>
            <a href="#mapa" class="active">Visor GIS</a>
            <a href="docs/informe_incendios_tarija.pdf" target="_blank">Informes PDF</a>
        </nav>
    </header>

    <div class="main-container">
        <!-- Panel Lateral de Controles -->
        <aside class="sidebar">
            <h3><i class="fa-solid fa-layer-group"></i> Herramientas de Campo</h3>
            
            <div class="section-block">
                <h4><i class="fa-solid fa-location-arrow"></i> Navegación y Track GPS</h4>
                <button id="btn-location" class="btn-tool"><i class="fa-solid fa-crosshairs"></i> Mi Ubicación Actual</button>
                <button id="btn-track-start" class="btn-tool btn-success"><i class="fa-solid fa-play"></i> Iniciar Track GPS</button>
                <button id="btn-track-stop" class="btn-tool btn-danger" disabled><i class="fa-solid fa-stop"></i> Detener Track</button>
            </div>

            <div class="section-block">
                <h4><i class="fa-solid fa-file-export"></i> Guardar y Exportar</h4>
                <button id="btn-export" class="btn-tool btn-primary"><i class="fa-solid fa-download"></i> Descargar Datos (GeoJSON)</button>
            </div>

            <div class="section-block info-box">
                <h4><i class="fa-solid fa-circle-info"></i> Ayuda rápida</h4>
                <p>Usa la barra de herramientas a la izquierda del mapa para digitalizar puntos o polígonos del incendio. El cálculo de hectáreas se generará automáticamente.</p>
            </div>
        </aside>

        <!-- Contenedor del Mapa Interactivo -->
        <main class="map-container">
            <div id="map"></div>
        </main>
    </div>

    <!-- Scripts JS necesarios -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
