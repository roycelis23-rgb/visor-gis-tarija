<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoTarija - Visor GIS y Monitoreo Territorial</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">
            <i class="fa-solid fa-fire-flame-curved"></i>
            <span>GeoTarija - Monitoreo Territorial</span>
        </div>
        <nav>
            <a href="#visor" class="active">Visor Tarija</a>
            <a href="docs/informe_incendios_tarija.pdf" target="_blank">Informes PDF</a>
        </nav>
    </header>

    <div class="main-container">
        <!-- Panel Lateral -->
        <aside class="sidebar">
            <h3><i class="fa-solid fa-layer-group"></i> Capas de Monitoreo</h3>
            
            <div class="section-block">
                <h4><i class="fa-solid fa-map"></i> Seleccionar Visor</h4>
                <button class="btn-layer active" data-layer="dndvi">
                    <i class="fa-solid fa-map-location-dot"></i> Mapa Departamental (Tarija)
                </button>
                <button class="btn-layer" data-layer="windy-viento">
                    <i class="fa-solid fa-wind"></i> Vientos en Tiempo Real (Windy)
                </button>
                <button class="btn-layer" data-layer="windy-fuego">
                    <i class="fa-solid fa-temperature-high"></i> Temperatura en Tiempo Real (Windy)
                </button>
                <button class="btn-layer" data-layer="copernicus">
                    <i class="fa-solid fa-satellite"></i> Satélite Copernicus Sentinel
                </button>
            </div>

            <div class="section-block">
                <h4><i class="fa-solid fa-download"></i> Descarga de Mapas</h4>
                <a href="docs/mapa_departamental_tarija.pdf" target="_blank" class="btn-download">
                    <i class="fa-solid fa-file-pdf"></i> Mapa Departamental (PDF)
                </a>
                <a href="docs/mapa_cicatrices_tarija.jpg" target="_blank" class="btn-download">
                    <i class="fa-solid fa-file-image"></i> Cicatrices de Incendios (JPG)
                </a>
            </div>
        </aside>

        <!-- Contenedor del Visor -->
        <main class="map-container">
            <iframe id="map-frame" src="https://www.openstreetmap.org/export/embed.html?bbox=-65.50%2C-22.10%2C-63.50%2C-21.00&amp;layer=mapnik"></iframe>
        </main>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
